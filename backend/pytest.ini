[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    unit: pure tests that do not require a database
    no_truncate: module owns its own database lifecycle (seed tests)
filterwarnings =
    # Our own deprecations are failures; third-party noise stays visible but non-fatal.
    error::DeprecationWarning:app.*
    error::DeprecationWarning:tests.*
